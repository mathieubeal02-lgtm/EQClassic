name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Prebuilt x86 dependencies published by the upstream maintainer (see docs/BUILD.md).
  DEPS_URL: https://archive.org/download/dependencies_202505/Dependencies.zip
  DEPS_CACHE_KEY: eqclassic-dependencies-202505-v1

jobs:
  windows-cmake:
    name: Windows x86 (CMake, ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dependencies.zip
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: Dependencies.zip
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Download Dependencies.zip
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri $env:DEPS_URL -OutFile Dependencies.zip -MaximumRetryCount 5 -RetryIntervalSec 30

      - name: Extract dependencies
        shell: pwsh
        run: |
          Expand-Archive -Path Dependencies.zip -DestinationPath deps-tmp -Force
          Copy-Item -Recurse -Force deps-tmp/Dependencies/* Dependencies/
          Get-ChildItem Dependencies

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Unit tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Install (server layout)
        run: cmake --install build --config ${{ matrix.config }} --prefix server

      - uses: actions/upload-artifact@v4
        with:
          name: eqclassic-server-${{ matrix.config }}
          path: server
          # keep the .keep files, otherwise the empty Maps/* folders are dropped
          include-hidden-files: true

  windows-msbuild:
    name: Windows x86 (legacy EQCEmu.sln, Debug)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dependencies.zip
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: Dependencies.zip
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Download Dependencies.zip
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri $env:DEPS_URL -OutFile Dependencies.zip -MaximumRetryCount 5 -RetryIntervalSec 30

      - name: Extract dependencies
        shell: pwsh
        run: |
          Expand-Archive -Path Dependencies.zip -DestinationPath deps-tmp -Force
          Copy-Item -Recurse -Force deps-tmp/Dependencies/* Dependencies/

      - uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild EQCEmu.sln /m /p:Configuration=Debug /p:Platform=Win32

  linux-azone:
    name: Linux (azone + eqbot + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libssl-dev
      - run: cmake -S . -B build -DEQC_BUILD_SERVERS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Bot chat service (a stub LLM, no network)
        run: python3 tools/botd/test_chatd.py

  # The Release servers from windows-cmake, under Wine with MariaDB, played by eqbot:
  # login, character creation, zone entry, twice (see tools/eqbot/ci-e2e.sh).
  e2e:
    name: End-to-end (servers under Wine, eqbot)
    needs: windows-cmake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Wine and build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64 libssl-dev zlib1g-dev

      - name: Build eqbot
        run: |
          cmake -S . -B build -DEQC_BUILD_SERVERS=OFF -DEQC_BUILD_AZONE=OFF -DEQC_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target eqbot --parallel

      - uses: actions/download-artifact@v4
        with:
          name: eqclassic-server-Release
          path: server

      - name: Servers + eqbot
        run: tools/eqbot/ci-e2e.sh server build/bin/eqbot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: server/logs
          if-no-files-found: ignore
